<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1a1a1a;font-size:15px;-webkit-text-size-adjust:100%;text-size-adjust:100%}

#tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ebebeb;flex-shrink:0;height:64px;padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:0;text-align:center;font-size:15px;color:#888;background:#f5f6f8;border:none;cursor:pointer;font-weight:500;font-family:inherit;display:flex;align-items:center;justify-content:center;min-height:56px}
.tab.on{background:#1a1a1a;color:#fff}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.card-h{display:flex;justify-content:space-between;align-items:center}
.fold-btn{border:none;background:transparent;font-size:20px;color:#999;cursor:pointer;padding:6px 12px;line-height:1;transition:transform .2s;font-family:inherit}

.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:#1a1a1a;color:#fff;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:10px;font-family:inherit}
.btn.o{background:#fff;color:#1a1a1a;border:1px solid #ddd}

.grid34{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid34 .cell{aspect-ratio:3/4;background:#d8d8dd;border-radius:8px;overflow:hidden;cursor:pointer}
.grid34 .cell img{width:100%;height:100%;object-fit:cover;background:#d8d8dd;display:block}
.img-viewer{margin-bottom:12px}
.img-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.img-nav button{width:56px;height:56px;border:none;background:#1a1a1a;color:#fff;border-radius:10px;font-size:22px;font-weight:500;cursor:pointer;font-family:inherit;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}

.img-stage-info{background:#fff;border-radius:10px;padding:10px 12px;font-size:12px;color:#666;line-height:1.5;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.img-stage-info .note{font-size:13px;color:#333;margin-top:6px;white-space:pre-wrap;word-break:break-word;line-height:1.6}

.today-card{background:linear-gradient(135deg,#ffffff 0%,#eef0ff 100%);text-align:center;padding:26px 14px;position:relative;overflow:hidden}
.today-card::before{content:'';position:absolute;top:-50px;right:-50px;width:140px;height:140px;border-radius:50%;background:#dfe3ff;opacity:.55}
.today-card::after{content:'';position:absolute;bottom:-40px;left:-40px;width:100px;height:100px;border-radius:50%;background:#dfe3ff;opacity:.4}
.today-label{font-size:13px;color:#7a82a8;letter-spacing:1px;position:relative;z-index:1}

.today-total{font-size:13px;color:#8e8e93;margin-top:12px;position:relative;z-index:1;padding-top:12px;border-top:1px dashed #d8dcf0}
.today-bg{position:absolute;inset:0;background-size:cover;background-position:center center;background-repeat:no-repeat;opacity:.6;transition:opacity .35s ease;z-index:0;pointer-events:none}

.grid11{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat-tile{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;display:flex;flex-direction:column}

.work-tile{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;display:flex;flex-direction:column}
.work-tile .thumb{aspect-ratio:1;background:#d8d8dd;overflow:hidden}
.work-tile .thumb img{width:100%;height:100%;object-fit:cover;display:block}

.cal .d{aspect-ratio:1 / 1.12;border-radius:8px;background:#f7f8fa;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;border:1px solid transparent;cursor:pointer;position:relative;padding:4px 1px 2px;overflow:hidden}

.cal .d.today{border-color:#999}

.cal .d .dur{font-size:8px;line-height:1.1;color:#aaa;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-align:center}
.cal .d.has .dur{color:rgba(255,255,255,.8)}

.seg{display:flex;background:#f0f0f3;border-radius:10px;padding:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:none;background:transparent;padding:8px 12px;font-size:13px;font-weight:500;color:#666;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button.on{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{height:8px;border-radius:6px;background:#f0f0f3;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:#1a1a1a;border-radius:6px}
.chk-block{margin-bottom:10px}
.chk{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer}
.chk .n{flex:1;min-width:0}

.chk .i{font-size:12px;color:#999;margin-top:2px}

.x-btn{width:32px;height:32px;border:none;background:transparent;font-size:22px;color:#999;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:12px;border:1px solid #e2e2e8;border-radius:10px;background:#fff;color:#1a1a1a;outline:none;margin-bottom:12px}
textarea{resize:vertical;min-height:60px}
label.fld{display:block;margin-bottom:4px;font-size:13px;color:#666;font-weight:500}
.empty{text-align:center;color:#aaa;padding:40px 10px;font-size:14px}
.stars{display:flex;gap:6px;font-size:30px;margin-bottom:12px;cursor:pointer;user-select:none}
.stars span{color:#e0e0e0;transition:color .15s}

.existing-stages{background:#f7f8fa;border-radius:8px;padding:10px;margin-bottom:12px}

.existing-stage-row:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.existing-stage-label{font-size:12px;color:#666;margin-bottom:6px;font-weight:500;line-height:1.5}
.existing-stage-thumbs{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px}
.existing-stage-thumbs img{width:48px;height:48px;object-fit:cover;border-radius:5px;flex-shrink:0;background:#d8d8dd}
.stage-btn-row{display:flex;gap:8px}
.stage-btn-row .btn{flex:1;margin:0;padding:8px 12px;font-size:13px}
.dur-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.dur-row input{flex:1;margin-bottom:0;text-align:center}
.dur-row .lbl{color:#999;font-size:13px;flex-shrink:0}
.work-menu-btn{width:36px;height:36px;border-radius:50%;background:#1a1a1a;color:#fff;border:none;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}
.node-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.node-head{display:flex;justify-content:space-between;align-items:center}
.node-name{font-weight:600}
.node-thumbs{display:flex;gap:6px;overflow-x:auto;padding-top:10px;margin-top:10px;border-top:1px solid #f2f2f5}
.node-thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#d8d8dd;cursor:pointer}
.node-cover{aspect-ratio:1;margin-top:10px;border-radius:8px;overflow:hidden;background:#d8d8dd}
.node-cover img{width:100%;height:100%;object-fit:cover;background:#d8d8dd;display:block}
.node-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.node-nav .nb{border:none;background:#f0f0f3;color:#1a1a1a;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1}
.node-nav .nb:disabled{opacity:.35;cursor:default}
.node-nav .nlabel{flex:1;text-align:center;font-size:13px;color:#666}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick-grid .pcell{aspect-ratio:1;background:#d8d8dd;border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.pick-grid .pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pick-grid .pcell.sel{outline:3px solid #1a1a1a;outline-offset:-3px}

<body>
<div id="top">
  <button class="side" id="back">‹</button>
  <span id="title">画集</span>
  <button class="side" id="action">＋</button>
</div>
<div id="view"></div>
<div id="tabs">
<button class="tab on" data-t="collections">画集</button>
<button class="tab" data-t="stats">统计</button>
<button class="tab" data-t="checkins">打卡</button>
<button class="tab" data-t="settings">设置</button>
</div>
<div id="modalRoot"></div>
<script>
var DB={categories:[],works:[],checkins:[],checkinLogs:[],plans:[]};
var state={tab:'collections',category:null,workId:null,workImgIdx:0,planId:null,nodeIdx:0,statRange:'week',calMonth:new Date(),openCheckin:null,ckFoldOpen:false,planFoldOpen:false};
var view=document.getElementById('view'),titleEl=document.getElementById('title'),backEl=document.getElementById('back'),actionEl=document.getElementById('action');

/* 今日卡片背景图（base64）与展示计时器 */
var todayBgImg=null;
var todayShowTimer=null;

var idb=null;
function openIDB(){
  return new Promise(function(res,rej){
    var req=indexedDB.open('draw_idb',2);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      ['categories','works','checkins','checkinLogs','plans','settings'].forEach(function(n){
        if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});
      });
    };
    req.onsuccess=function(e){idb=e.target.result;res();};
    req.onerror=function(e){rej(e.target.error);};
  });
}
function tx(store,mode){return idb.transaction(store,mode||'readonly').objectStore(store);}
function idbAll(store){return new Promise(function(res,rej){var r=tx(store).getAll();r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbPut(store,obj){return new Promise(function(res,rej){var r=tx(store,'readwrite').put(obj);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}
function idbDel(store,id){return new Promise(function(res,rej){var r=tx(store,'readwrite').delete(id);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}
function idbClear(store){return new Promise(function(res,rej){var r=tx(store,'readwrite').clear();r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}

function uid(){return Date.now()+Math.floor(Math.random()*100000)}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtTs(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDur(m){m=Math.round(m||0);if(m<60)return m+'分';var h=Math.floor(m/60),mm=m%60;return mm?h+'时'+mm+'分':h+'时'}
function fmtDurCal(m){m=Math.round(m||0);if(m<60)return m+'min';var h=Math.floor(m/60),mm=m%60;return mm?h+'h'+mm+'min':h+'h';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999';document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}

function bindPress(el,onTap,onLong,dur){
  var timer=null,longFired=false,pressing=false;
  var DUR=dur||600;
  el.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    pressing=true;longFired=false;
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){
      if(pressing){longFired=true;onLong();if(navigator.vibrate){try{navigator.vibrate(40)}catch(_){}}}
    },DUR);
  });
  el.addEventListener('pointerup',function(e){
    if(!pressing)return;
    e.preventDefault();e.stopPropagation();
    clearTimeout(timer);pressing=false;
    if(!longFired)onTap();
    setTimeout(function(){longFired=false},80);
  });
  el.addEventListener('pointercancel',function(){if(timer)clearTimeout(timer);pressing=false;longFired=false;});
  el.addEventListener('pointerleave',function(){if(timer)clearTimeout(timer);pressing=false;longFired=false;});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
  el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation()});
}

function workTotal(w){if(!w.stages||!w.stages.length)return 0;return w.stages[w.stages.length-1].cumulative||0}
function stageDur(w,i){var prev=i===0?0:(w.stages[i-1].cumulative||0);return (w.stages[i].cumulative||0)-prev}
function workCover(w){
  if(!w.stages||!w.stages.length)return null;
  for(var i=w.stages.length-1;i>=0;i--){var imgs=w.stages[i].images;if(imgs&&imgs.length)return imgs[imgs.length-1];}
  return null;
}
function workImgCount(w){var n=0;(w.stages||[]).forEach(function(s){n+=(s.images||[]).length});return n}
function workCreatedAt(w){
  if(w.createdAt)return w.createdAt;
  if(w.stages&&w.stages.length&&w.stages[0].date)return new Date(w.stages[0].date+'T00:00:00').getTime();
  return null;
}
function getAutoAssignedWorks(plan, allWorks){
  var assigned = plan.nodes.map(function(n){ return { node: n, works: [], totalMin: 0 }; });
  var targetWorks = allWorks.filter(function(w){ return String(w.planId)===String(plan.id); });
  targetWorks.sort(function(a,b){return (workCreatedAt(a)||0) - (workCreatedAt(b)||0);});
  var currentNodeIdx = 0;
  var nodeAccumulatedTime = 0;
  targetWorks.forEach(function(w){
    var wTotal = workTotal(w);
    if (currentNodeIdx < assigned.length) {
      var node = assigned[currentNodeIdx];
      var nodeTargetMin = (node.node.hours || 0) * 60;
      if (nodeAccumulatedTime > 0 && nodeTargetMin > 0 && nodeAccumulatedTime + wTotal > nodeTargetMin) {
        currentNodeIdx++;
        nodeAccumulatedTime = 0;
        if (currentNodeIdx >= assigned.length) return;
      }
      assigned[currentNodeIdx].works.push(w);
      assigned[currentNodeIdx].totalMin += wTotal;
      nodeAccumulatedTime += wTotal;
    }
  });
  return assigned;
}
function starsHTML(rating,small,nomb){
  var cls='stars'+(small?' sm':'')+(nomb?' nomb':'');
  var h='<div class="'+cls+'">';
  for(var i=1;i<=5;i++)h+='<span data-v="'+i+'" class="'+(i<=rating?'on':'')+'">★</span>';
  h+='</div>';
  return h;
}
function processImage(file){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(e){res(e.target.result);};
    rd.onerror=rej;
    rd.readAsDataURL(file);
  });
}
function openModal(title,body,footer){
  var h='<div class="mask"><div class="modal">';
  h+='<div class="modal-h"><h2>'+esc(title)+'</h2><button class="x-btn" data-close>✕</button></div>';
  h+='<div class="modal-b">'+body+'</div>';
  if(footer)h+='<div class="modal-f">'+footer+'</div>';
  h+='</div></div>';
  document.getElementById('modalRoot').innerHTML=h;
  document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeModal});
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function renderTabs(){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.t===state.tab)})}

function go(tab){
  state.tab=tab;state.category=null;state.workId=null;state.workImgIdx=0;state.planId=null;state.nodeIdx=0;state.openCheckin=null;
  renderTabs();backEl.style.display='none';
  if(tab==='collections'){actionEl.style.display='block';actionEl.onclick=addCategoryModal;renderCollections()}
  else if(tab==='stats'){actionEl.style.display='none';renderStats()}
  else if(tab==='checkins'){actionEl.style.display='block';actionEl.onclick=addCheckinOrPlan;renderCheckins()}
  else{actionEl.style.display='none';renderSettings()}
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){go(t.dataset.t)}});
backEl.onclick=function(){
  if(state.tab==='planDetail'){state.planId=null;state.nodeIdx=0;go('checkins')}
  else if(state.workId){state.workId=null;state.workImgIdx=0;renderCategoryView()}
  else if(state.category){go('collections')}
};

/* ============ 画集 ============ */
function renderCollections(){
  titleEl.textContent='画集';
  actionEl.style.display='block';actionEl.onclick=addCategoryModal;
  backEl.style.display='none';state.category=null;state.workId=null;
  if(!DB.categories.length){view.innerHTML='<div class="empty">还没有画集<br>点右上角 ＋ 新建分类</div>';return}
  var h='<div class="grid11">';
  DB.categories.forEach(function(c){
    var works=DB.works.filter(function(w){return w.category===c.name});
    var total=works.reduce(function(s,w){return s+workTotal(w)},0);

    for(var i=works.length-1;i>=0;i--){cover=workCover(works[i]);if(cover)break}

    h+='<div class="thumb">'+(cover?'<img src="'+cover+'">':'')+'</div>';

    h+='</div>';
  });

function openCategory(name){state.category=name;state.workId=null;state.workImgIdx=0;renderCategoryView()}
function renderCategoryView(){
  titleEl.textContent=state.category;

    h+='</div>';
  });
  h+='</div>';
  view.innerHTML=h;
  view.querySelectorAll('[data-work]').forEach(function(el){el.onclick=function(){openWork(Number(el.dataset.work))}});
}
function openWork(id){state.workId=id;state.workImgIdx=0;renderWorkView()}

/* ===== 作品详情 ===== */
function renderWorkView(){
  var w=DB.works.find(function(x){return x.id===state.workId});
  if(!w){state.workId=null;renderCategoryView();return}
  titleEl.textContent='作品';
  backEl.style.display='block';actionEl.style.display='none';
  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">';
  h+=starsHTML(w.rating||0,false,true);
  h+='<button class="work-menu-btn" id="workMenu">⋯</button>';
  h+='</div>';
  var ca=workCreatedAt(w);
  if(ca)h+='<div class="muted" style="margin-top:10px">添加于 '+fmtTs(ca)+'</div>';
  if(w.planId){
    var p=DB.plans.find(function(x){return Number(x.id)===Number(w.planId)});
    if(p){h+='<div class="muted" style="margin-top:4px">计划：'+esc(p.name)+'（自动分配）</div>';}
  }
  if(w.note)h+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f2f2f5;white-space:pre-wrap">'+esc(w.note)+'</div>';
  h+='</div>';

  var imgList=[];
  (w.stages||[]).forEach(function(s,i){
    var prev=i===0?0:(w.stages[i-1].cumulative||0);
    var dur=(s.cumulative||0)-prev;
    (s.images||[]).forEach(function(img){
      imgList.push({img:img,stageIdx:i,dur:dur,cumulative:s.cumulative,note:s.note||'',date:s.date||''});
    });
  });
  imgList.reverse();

  if(imgList.length){
    if(state.workImgIdx<0)state.workImgIdx=0;
    if(state.workImgIdx>imgList.length-1)state.workImgIdx=imgList.length-1;
    var cur=imgList[state.workImgIdx];
    h+='<div class="img-viewer">';
    h+='<div class="img-nav">';
    h+='<button id="imgPrev"'+(state.workImgIdx===0?' disabled':'')+'>◀</button>';
    h+='<div class="img-counter">'+(state.workImgIdx+1)+' / '+imgList.length+'</div>';
    h+='<button id="imgNext"'+(state.workImgIdx===imgList.length-1?' disabled':'')+'>▶</button>';
    h+='</div>';
    h+='<div class="img-stage-info">';
    h+='阶段 '+(cur.stageIdx+1)+' · 用时 '+fmtDur(cur.dur)+' · 累计 '+fmtDur(cur.cumulative)+(cur.date?' · '+esc(cur.date):'');
    if(cur.note)h+='<div class="note">'+esc(cur.note)+'</div>';
    h+='</div>';
    h+='<div class="img-big"><img src="'+cur.img+'"></div>';
    h+='</div>';
  }else{
    h+='<div class="empty">还没有图片</div>';
  }
  view.innerHTML=h;

  var prevBtn=document.getElementById('imgPrev');
  var nextBtn=document.getElementById('imgNext');
  if(prevBtn)prevBtn.onclick=function(){if(state.workImgIdx>0){state.workImgIdx--;renderWorkView();}};
  if(nextBtn)nextBtn.onclick=function(){if(state.workImgIdx<imgList.length-1){state.workImgIdx++;renderWorkView();}};

  var starsEl=view.querySelector('.stars');
  starsEl.querySelectorAll('span').forEach(function(s){
    s.onclick=function(){w.rating=Number(s.dataset.v);idbPut('works',w).then(function(){renderWorkView();});};
  });
  document.getElementById('workMenu').onclick=function(){
    openModal('作品操作',
      '<button class="btn" id="wedit" style="margin-bottom:10px">编辑作品</button><button class="btn o" id="wdel" style="color:#c33">删除作品</button>',
      '<button class="btn o" data-close>取消</button>');
    document.getElementById('wedit').onclick=function(){closeModal();addWorkModal(w,w.category)};
    document.getElementById('wdel').onclick=function(){
      if(!confirm('确定删除这个作品？'))return;
      idbDel('works',w.id).then(function(){
        DB.works=DB.works.filter(function(x){return x.id!==w.id});
        closeModal();toast('已删除');state.workId=null;state.workImgIdx=0;renderCategoryView();
      });
    };
  };
}

function addWorkModal(work,category){
  var editing=!!work;
  var rating=work?work.rating:0;
  var newFiles=[];
  var defH=editing?'':'1';
  var defM=editing?'':'30';
  var body='';
  body+='<label class="fld">分类</label><select id="wf-cat">';
  DB.categories.forEach(function(c){body+='<option value="'+esc(c.name)+'"'+(c.name===category?' selected':'')+'>'+esc(c.name)+'</option>'});
  body+='</select>';
  body+='<label class="fld">评分（必填）</label>'+starsHTML(rating,false).replace('class="stars"','class="stars" id="wf-stars"');
  if(DB.plans.length){
    body+='<label class="fld">加入计划（可选，按时间自动分配节点）</label><select id="wf-plan"><option value="">不加入计划</option>';
    DB.plans.forEach(function(p){
      var sel=work&&String(work.planId)===String(p.id)?' selected':'';
      body+='<option value="'+p.id+'"'+sel+'>'+esc(p.name)+'</option>';
    });
    body+='</select>';
  }
  body+='<label class="fld">作品备注（可选）</label><textarea id="wf-note" placeholder="整体想法、感受">'+(work?esc(work.note||''):'')+'</textarea>';
  if(editing&&work.stages&&work.stages.length){
    body+='<div class="existing-stages"><div class="muted" style="margin-bottom:8px;font-weight:500">已有阶段（可编辑、删除）</div>';
    work.stages.forEach(function(stage,idx){
      var prevCum=idx===0?0:(work.stages[idx-1].cumulative||0);
      var dur=(stage.cumulative||0)-prevCum;
      body+='<div class="existing-stage-row">';
      body+='<div class="existing-stage-label">阶段 '+(idx+1)+' · '+fmtDur(dur)+' · 累计 '+fmtDur(stage.cumulative)+(stage.note?' · '+esc(stage.note):'')+'</div>';
      if(stage.images&&stage.images.length){
        body+='<div class="existing-stage-thumbs">';
        stage.images.forEach(function(img){body+='<img src="'+img+'">'});
        body+='</div>';
      }
      body+='<div class="stage-btn-row">';
      body+='<button class="btn o" id="stage-edit-btn-'+idx+'" type="button">编辑</button>';
      body+='<button class="btn o" id="stage-del-btn-'+idx+'" type="button" style="color:#c33">删除</button>';
      body+='</div>';
      body+='</div>';
    });
    body+='</div>';
  }
  if(editing)body+='<div class="muted" style="margin:10px 0 8px;font-weight:500">添加新阶段（可选）</div>';
  body+='<label class="fld">图片（可多选，不限张数，按原图保存）</label><input type="file" id="wf-file" accept="image/*" multiple><div id="wf-prev" class="grid34" style="margin-top:10px"></div>';
  body+='<label class="fld">'+(editing?'新阶段累计总时长':'累计总时长')+'</label>';
  body+='<div class="dur-row"><input type="number" id="wf-h" min="0" placeholder="时" value="'+defH+'"><span class="lbl">时</span><input type="number" id="wf-m" min="0" max="59" placeholder="分" value="'+defM+'"><span class="lbl">分</span></div>';
  body+='<label class="fld">日期</label><input type="date" id="wf-date" value="'+today()+'">';
  body+='<label class="fld">阶段备注（可选）</label><textarea id="wf-snote"></textarea>';
  openModal(editing?'编辑作品':'添加作品',body,'<button class="btn o" data-close>取消</button><button class="btn" id="wf-save">保存</button>');

  var starsEl=document.getElementById('wf-stars');
  starsEl.querySelectorAll('span').forEach(function(s){
    s.onclick=function(){
      rating=Number(s.dataset.v);
      starsEl.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',Number(x.dataset.v)<=rating)});
    };
  });
  if(editing&&work.stages){
    work.stages.forEach(function(stage,idx){
      var eb=document.getElementById('stage-edit-btn-'+idx);
      if(eb)eb.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        openEditStageModal(work,idx);
      };
      var db=document.getElementById('stage-del-btn-'+idx);
      if(db)db.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        if(!confirm('确定删除阶段 '+(idx+1)+'？后续阶段的累计时长会自动调整。'))return;
        var removedDur=stageDur(work,idx);
        work.stages.splice(idx,1);
        for(var i=idx;i<work.stages.length;i++){
          work.stages[i].cumulative=(work.stages[i].cumulative||0)-removedDur;
        }
        idbPut('works',work).then(function(){
          toast('阶段已删除');
          closeModal();
          addWorkModal(work,work.category);
        });
      };
    });
  }
  var planSel=document.getElementById('wf-plan');
  document.getElementById('wf-file').onchange=function(e){
    newFiles=[].slice.call(e.target.files);
    var p=document.getElementById('wf-prev');p.innerHTML='';
    newFiles.forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(ev){var d=document.createElement('div');d.className='cell';d.innerHTML='<img src="'+ev.target.result+'">';p.appendChild(d)};
      rd.readAsDataURL(f);
    });
  };
  document.getElementById('wf-save').onclick=function(){
    if(!rating){toast('请先评分');return}
    var cat=document.getElementById('wf-cat').value;
    var note=document.getElementById('wf-note').value.trim();
    var planId=null;
    if(planSel&&planSel.value){planId=Number(planSel.value);}
    if(editing){
      work.category=cat;work.note=note;work.planId=planId;work.rating=rating;
      if(newFiles.length){
        var hh=parseInt(document.getElementById('wf-h').value)||0;
        var mm=parseInt(document.getElementById('wf-m').value)||0;
        var cum=hh*60+mm;
        var date=document.getElementById('wf-date').value||today();
        var snote=document.getElementById('wf-snote').value.trim();
        var lastCum=workTotal(work);
        if(cum<=lastCum){toast('新累计时长须大于 '+fmtDur(lastCum));return}
        var done=0,newImages=[];
        newFiles.forEach(function(f){
          processImage(f).then(function(d){
            newImages.push(d);done++;
            if(done===newFiles.length){
              work.stages.push({images:newImages,cumulative:cum,date:date,note:snote});
              idbPut('works',work).then(function(){closeModal();toast('已保存');renderWorkView();});
            }
          });
        });
      }else{
        idbPut('works',work).then(function(){closeModal();toast('已保存');renderWorkView();});
      }
    }else{
      if(!newFiles.length){toast('请选择图片');return}
      var hh2=parseInt(document.getElementById('wf-h').value)||0;
      var mm2=parseInt(document.getElementById('wf-m').value)||0;
      var cum2=hh2*60+mm2;
      if(cum2<=0){toast('请输入累计时长');return}
      var date2=document.getElementById('wf-date').value||today();
      var snote2=document.getElementById('wf-snote').value.trim();
      var done2=0,images=[];
      newFiles.forEach(function(f){
        processImage(f).then(function(d){
          images.push(d);done2++;
          if(done2===newFiles.length){
            var nw={id:uid(),category:cat,rating:rating,planId:planId,note:note,createdAt:Date.now(),
              stages:[{images:images,cumulative:cum2,date:date2,note:snote2}]};
            DB.works.push(nw);
            idbPut('works',nw).then(function(){closeModal();toast('已添加');renderCategoryView();});
          }
        });
      });
    }
  };
}

/* ===== 编辑阶段：改的是本阶段用时；不能比原来小；可改大；可不改 ===== */
function openEditStageModal(work,idx){
  var stage=work.stages[idx];
  if(!stage)return;
  var prevCum=idx===0?0:(work.stages[idx-1].cumulative||0);
  var oldDur=(stage.cumulative||0)-prevCum;
  var oldH=Math.floor(oldDur/60);
  var oldM=oldDur%60;
  var body='';
  body+='<label class="fld">本阶段用时（不能小于原来，可留空不改）</label>';
  body+='<div class="dur-row"><input type="number" id="edit-h" min="0" placeholder="时" value="'+oldH+'"><span class="lbl">时</span><input type="number" id="edit-m" min="0" max="59" placeholder="分" value="'+oldM+'"><span class="lbl">分</span></div>';
  body+='<div class="muted" style="margin-top:-6px;margin-bottom:12px">原用时：'+fmtDur(oldDur)+'</div>';
  body+='<label class="fld">日期</label><input type="date" id="edit-date" value="'+(stage.date||today())+'">';
  body+='<label class="fld">备注</label><textarea id="edit-note">'+esc(stage.note||'')+'</textarea>';
  openModal('编辑阶段 '+(idx+1),body,'<button class="btn o" data-close>取消</button><button class="btn" id="edit-save">保存</button>');
  document.getElementById('edit-save').onclick=function(){
    var hVal=document.getElementById('edit-h').value.trim();
    var mVal=document.getElementById('edit-m').value.trim();
    var newDate=document.getElementById('edit-date').value;
    var newNote=document.getElementById('edit-note').value.trim();
    var sameAsOld=(String(oldH)===hVal||(oldH===0&&hVal===''))&&(String(oldM)===mVal||(oldM===0&&mVal===''));
    if(!sameAsOld && (hVal!=='' || mVal!=='')){
      var newH=parseInt(hVal)||0;
      var newM=parseInt(mVal)||0;
      var newDur=newH*60+newM;
      if(newDur<oldDur){toast('本阶段用时不能小于 '+fmtDur(oldDur));return}
      var diff=newDur-oldDur;
      stage.cumulative=(stage.cumulative||0)+diff;
      for(var i=idx+1;i<work.stages.length;i++){
        work.stages[i].cumulative=(work.stages[i].cumulative||0)+diff;
      }
    }
    stage.date=newDate;
    stage.note=newNote;
    idbPut('works',work).then(function(){
      closeModal();
      toast('阶段已更新');
      setTimeout(function(){ closeModal(); addWorkModal(work,work.category); }, 100);
    });
  };
}

function streakCount(logs){
  if(!logs.length)return 0;
  var set={};logs.forEach(function(d){set[d]=1});
  var cur=new Date();
  if(!set[fmtDate(cur)])cur.setDate(cur.getDate()-1);
  var n=0;
  while(set[fmtDate(cur)]){n++;cur.setDate(cur.getDate()-1)}
  return n;
}
function renderCheckins(){
  titleEl.textContent='打卡';
  backEl.style.display='none';actionEl.style.display='block';actionEl.onclick=addCheckinOrPlan;
  var h='';
  h+='<div class="card">';
  h+='<h3 class="card-h"><span>打卡</span><button class="fold-btn'+(state.ckFoldOpen?'':' closed')+'" id="ckFold">▾</button></h3>';
  h+='<div id="ckBody"'+(state.ckFoldOpen?'':' class="hidden"')+'>';
  if(!DB.checkins.length){
    h+='<div class="muted" style="padding:6px 0">还没有打卡项</div>';
  }else{
    DB.checkins.forEach(function(c){
      var logs=DB.checkinLogs.filter(function(l){return Number(l.checkinId)===Number(c.id)}).map(function(l){return l.date}).sort();
      var last=logs[logs.length-1];
      var info='还没有打卡';
      if(last){var days=Math.round((new Date(today())-new Date(last))/86400000);info='距今天 '+days+' 天';}
      var sc=streakCount(logs);
      var doneToday=logs.indexOf(today())>=0;
      var opened=Number(state.openCheckin)===Number(c.id);
      h+='<div class="chk-block">';
      h+='<div class="chk" data-chk="'+c.id+'" style="margin-top:8px"><div class="n"><div class="nm">'+esc(c.name)+'</div><div class="i">'+info+' · 连续 '+sc+' 天</div></div><button class="btn sm'+(doneToday?' punched':'')+'" data-do="'+c.id+'">'+(doneToday?'已打卡':'打卡')+'</button></div>';
      h+='<div class="chk-month'+(opened?'':' hidden')+'" id="cm-'+c.id+'"><div class="chk-month-inner">'+checkinCalendarHTML(c.id)+'<div class="chk-month-actions"><button class="btn o" data-ckedit="'+c.id+'">修改</button><button class="btn o" data-ckdel="'+c.id+'" style="color:#c33">删除</button></div></div></div>';
      h+='</div>';
    });
  }
  h+='</div></div>';

function addCheckinOnDate(checkinId,date){
  if(date>today()){toast('不能给未来日期打卡');return}
  if(DB.checkinLogs.some(function(l){return Number(l.checkinId)===Number(checkinId)&&l.date===date})){toast('这天已打卡');return}
  var log={id:uid(),checkinId:checkinId,date:date};
  DB.checkinLogs.push(log);
  idbPut('checkinLogs',log).then(function(){toast('已补卡 '+date);renderCheckins();});
}
function removeCheckinOnDate(checkinId,date){
  var log=DB.checkinLogs.find(function(l){return Number(l.checkinId)===Number(checkinId)&&l.date===date});
  if(!log){toast('这天没有打卡记录');return}
  idbDel('checkinLogs',log.id).then(function(){
    DB.checkinLogs=DB.checkinLogs.filter(function(l){return l.id!==log.id});
    toast('已取消 '+date);renderCheckins();
  });
}
function toggleCheckinMonth(id){

  var el=document.getElementById('cm-'+id);
  if(el){if(Number(state.openCheckin)===Number(id))el.classList.remove('hidden');else el.classList.add('hidden');}

}
function cancelCheckin(id){

function openPlanDetail(id){state.planId=id;state.nodeIdx=0;state.tab='planDetail';renderPlanDetail();}
function renderPlanDetail(){

  var targetMin=(p.totalHours||0)*60;
  var pct=targetMin?Math.min(100,total/targetMin*100):0;

  h+='<div class="bar" style="height:10px;margin-top:8px"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="muted" style="margin-top:6px">'+pct.toFixed(1)+'% · 作品已按时间自动分配至节点</div>';
  h+='</div>';
  var nodes=p.nodes||[];

    if(state.nodeIdx<0)state.nodeIdx=0;
    if(state.nodeIdx>nodes.length-1)state.nodeIdx=nodes.length-1;

    var n=currentAssigned.node;
    var nWorks=currentAssigned.works;
    var nTotal=currentAssigned.totalMin;
    var nTarget=(n.hours||0)*60;
    var nPct=nTarget?Math.min(100,nTotal/nTarget*100):0;
    var imgs=[];

    h+='<button class="nb" id="nodeNext"'+(state.nodeIdx===nodes.length-1?' disabled':'')+'>›</button>';

    h+='<div class="node-head"><div>';
    h+='<div class="node-name">'+esc(n.name)+'</div>';
    if(nTarget){
      h+='<div class="muted" style="margin-top:4px">'+fmtDur(nTotal)+' / '+n.hours.toFixed(1)+' 小时</div>';
      h+='<div class="bar"><i style="width:'+nPct+'%"></i></div>';
    }else{
      h+='<div class="muted" style="margin-top:4px">累计 '+fmtDur(nTotal)+'</div>';
    }
    h+='</div>';
    if(imgs.length)h+='<button class="btn sm o" id="pickCoverBtn">选封面</button>';
    h+='</div>';
    if(imgs.length){
      var cover=(n.coverImg&&imgs.indexOf(n.coverImg)>=0)?n.coverImg:imgs[0];
      h+='<div class="node-cover"><img src="'+cover+'" id="nodeBigImg"></div>';
      h+='<div class="node-thumbs">';
      imgs.forEach(function(img){
        h+='<img src="'+img+'" data-thumb="'+img+'"'+(img===cover?' style="outline:2px solid #1a1a1a;outline-offset:-2px"':'')+'>';
      });

  h+='<button class="btn o" id="delPlan" style="margin-top:12px;color:#c33">删除计划</button>';

        el.style.outline='2px solid #1a1a1a';
        el.style.outlineOffset='-2px';
      };
    });
  }

  var pv=document.getElementById('nodePrev');

  if(pv)pv.onclick=function(){if(state.nodeIdx>0){state.nodeIdx--;renderPlanDetail()}};
  if(nx)nx.onclick=function(){if(state.nodeIdx<nodes.length-1){state.nodeIdx++;renderPlanDetail()}};
  var pc=document.getElementById('pickCoverBtn');
  if(pc)pc.onclick=function(e){e.stopPropagation();pickCover(p,nodes[state.nodeIdx].id)};

function pickCover(p,nodeId){
  var assigned=getAutoAssignedWorks(p,DB.works);

  if(!imgs.length){toast('该节点还没有图片');return}
  var h='<div class="pick-grid">';

  h+='</div>';

    el.onclick=function(){
      n.coverImg=el.dataset.pick;

    };
  });
}

/* ============ 统计 ============ */
function renderStats(){
  titleEl.textContent='统计';
  backEl.style.display='none';actionEl.style.display='none';
  if(!DB.works.length&&!DB.checkins.length){view.innerHTML='<div class="empty">还没有数据</div>';return}
  var allStages=[];
  DB.works.forEach(function(w){w.stages.forEach(function(s,i){allStages.push({date:s.date,duration:stageDur(w,i),category:w.category,images:s.images||[]})});});
  var td=today();
  var todayMin=allStages.filter(function(s){return s.date===td}).reduce(function(a,s){return a+s.duration},0);
  var allMin=allStages.reduce(function(a,s){return a+s.duration},0);
  var hasBg=!!todayBgImg;
  var h='<div class="card today-card'+(hasBg?' has-bg':'')+'" id="todayCard">';
  if(hasBg)h+='<div class="today-bg" style="background-image:url(\''+todayBgImg+'\')"></div>';
  h+='<div class="today-content">';
  h+='<div class="today-label">今日画画</div>';
  h+='<div class="today-value">'+fmtDur(todayMin)+'</div>';
  h+='<div class="today-total">总绘画时长 '+fmtDur(allMin)+'</div>';
  h+='</div>';
  h+='</div>';
  h+=renderImageCalendar();
  var h2='<div class="seg">';
  [['week','周'],['month','月'],['year','年']].forEach(function(r){h2+='<button data-r="'+r[0]+'"'+(state.statRange===r[0]?' class="on"':'')+'>'+r[1]+'</button>';});
  h2+='</div>';
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var pts=[],total=0,title='';
  if(state.statRange==='week'){
    title='本周每天时长';
    var ws=new Date(now);var day=(ws.getDay()+6)%7;ws.setDate(ws.getDate()-day);
    for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());var v=allStages.filter(function(s){return s.date===ds}).reduce(function(a,s){return a+s.duration},0);pts.push({l:['一','二','三','四','五','六','日'][i],v:v});total+=v;}
  }else if(state.statRange==='month'){
    title='本月每天时长';
    var days=new Date(y,m+1,0).getDate();
    for(var d2=1;d2<=days;d2++){var ds2=y+'-'+pad(m+1)+'-'+pad(d2);var v2=allStages.filter(function(s){return s.date===ds2}).reduce(function(a,s){return a+s.duration},0);pts.push({l:String(d2),v:v2});total+=v2;}
  }else{
    title='本年每月时长';
    for(var mm=1;mm<=12;mm++){var pre=y+'-'+pad(mm);var v3=allStages.filter(function(s){return (s.date||'').slice(0,7)===pre}).reduce(function(a,s){return a+s.duration},0);pts.push({l:mm+'月',v:v3});total+=v3;}
  }
  h2+='<div class="card"><h3>'+title+'</h3><div class="muted" style="margin-bottom:6px">合计 '+fmtDur(total)+'</div>'+lineChart(pts)+'</div>';
  var cat={};
  allStages.forEach(function(s){var k=s.category||'未分类';cat[k]=(cat[k]||0)+s.duration});
  var ca=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]});
  var cm=Math.max(1,Math.max.apply(null,ca.map(function(k){return cat[k]})));
  h2+='<div class="card"><h3>分类汇总</h3>';
  ca.forEach(function(k){h2+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+esc(k)+'</span><span class="muted">'+fmtDur(cat[k])+'</span></div><div class="bar"><i style="width:'+(cat[k]/cm*100)+'%"></i></div></div>';});
  h2+='</div>';
  view.innerHTML=h+h2;
  view.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){state.statRange=b.dataset.r;renderStats()}});
  bindCalendarEvents();

  /* 今日卡片：有背景图时点击放大显示 5 秒，然后恢复默认 */
  var todayCard=document.getElementById('todayCard');
  if(todayCard&&hasBg){
    todayCard.onclick=function(){
      todayCard.classList.add('show-bg');
      if(todayShowTimer)clearTimeout(todayShowTimer);
      todayShowTimer=setTimeout(function(){
        todayCard.classList.remove('show-bg');
        todayShowTimer=null;
      },5000);
    };
  }
}
function renderImageCalendar(){
  var d=state.calMonth;
  var y=d.getFullYear(),m=d.getMonth();
  var dayData={};
  DB.works.forEach(function(w){
    w.stages.forEach(function(s,i){
      if(!s.date)return;
      if(s.date.slice(0,7)!==y+'-'+pad(m+1))return;
      if(!dayData[s.date])dayData[s.date]={works:0,dur:0};
      dayData[s.date].dur+=stageDur(w,i);
      if(s.images&&s.images.length)dayData[s.date].works+=1;
    });
  });
  var first=new Date(y,m,1),sp=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var cells='';
  ['一','二','三','四','五','六','日'].forEach(function(w){cells+='<div class="w">'+w+'</div>'});
  for(var i=0;i<sp;i++)cells+='<div></div>';
  var td=today();
  for(var day=1;day<=days;day++){
    var ds=y+'-'+pad(m+1)+'-'+pad(day);
    var info=dayData[ds];
    var dur=info&&info.dur>0?info.dur:0;
    var wk=info&&info.works>0?info.works:0;
    var has=dur>0||wk>0;
    cells+='<div class="d'+(has?' has':'')+(ds===td?' today':'')+'" data-calday="'+ds+'">'
      +'<span class="n">'+(wk>0?wk:'')+'</span>'
      +'<span class="dd">'+day+'</span>'
      +'<span class="dur">'+(dur>0?fmtDurCal(dur):'')+'</span>'
      +'</div>';
  }
  return '<div class="card cal-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="btn sm o" data-cal="prev">‹</button><strong>'+y+'年'+(m+1)+'月</strong><button class="btn sm o" data-cal="next">›</button></div><div class="cal">'+cells+'</div></div>';
}
function bindCalendarEvents(){
  view.querySelectorAll('[data-cal]').forEach(function(b){
    b.onclick=function(){
      var d=new Date(state.calMonth);
      d.setMonth(d.getMonth()+(b.dataset.cal==='prev'?-1:1));
      state.calMonth=d;renderStats();
    };
  });
  view.querySelectorAll('[data-calday]').forEach(function(el){
    el.onclick=function(){showDayImages(el.dataset.calday)};
  });
}
function showDayImages(ds){
  var imgs=[];
  var totalMin=0;
  DB.works.forEach(function(w){
    w.stages.forEach(function(s,i){
      if(s.date===ds){(s.images||[]).forEach(function(img){imgs.push(img)});totalMin+=stageDur(w,i);}
    });
  });
  var h='<div class="muted" style="margin-bottom:10px">'+ds+' · 总绘制 '+fmtDur(totalMin)+'</div>';
  if(!imgs.length)h+='<div class="empty">这一天没有图片</div>';
  else{h+='<div class="grid34">';imgs.forEach(function(img){h+='<div class="cell"><img src="'+img+'"></div>'});h+='</div>'}
  openModal(ds+' 的图片（'+imgs.length+'）',h,'<button class="btn o" data-close>关闭</button>');
}
function lineChart(pts){
  var W=340,H=130,PL=32,PR=12,PT=14,PB=24,n=pts.length;
  var max=Math.max(1,Math.max.apply(null,pts.map(function(p){return p.v})));
  var nm=Math.ceil(max/60)*60||60;
  var sx=n>1?(W-PL-PR)/(n-1):0;
  var ps=pts.map(function(p,i){return{x:PL+i*sx,y:H-PB-(p.v/nm)*(H-PT-PB),v:p.v,l:p.l}});
  var line=ps.map(function(p,i){return(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ');
  var area=line+' L '+ps[n-1].x.toFixed(1)+' '+(H-PB)+' L '+ps[0].x.toFixed(1)+' '+(H-PB)+' Z';
  var grid='';
  for(var g=0;g<=2;g++){var y=PT+(H-PT-PB)*g/2;var valMin=nm*(1-g/2);var val=(valMin/60).toFixed(valMin%60===0?0:1)+'h';grid+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#d0d0d8"/><text x="'+(PL-6)+'" y="'+(y+3)+'" font-size="9" fill="#a0a0a8" text-anchor="end">'+val+'</text>'}
  var dots=ps.map(function(p){return'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>'}).join('');
  var lbs=ps.map(function(p,i){if(n>12&&i%2!==0)return'';return'<text x="'+p.x+'" y="'+(H-9)+'" font-size="9" fill="#999" text-anchor="middle">'+p.l+'</text>'}).join('');
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+'<path d="'+area+'" fill="#1a1a1a" opacity="0.08"/><path d="'+line+'" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>'+dots+lbs+'</svg>';
}

  DB.categories.forEach(function(c){
    var n=DB.works.filter(function(w){return w.category===c.name}).length;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f2f2f5"><div><div style="font-weight:500">'+esc(c.name)+'</div><div class="muted">'+n+' 个作品</div></div><button class="btn sm o" data-delcat="'+c.id+'" style="color:#c33">删除</button></div>';
  });
  h+='</div>';
  h+='<button class="btn" id="addCat">＋ 新建分类</button>';

  /* 今日卡片背景图设置 */
  h+='<div class="card"><h3>今日画画卡片背景</h3>';
  h+='<label class="fld">上传背景图（自动以 60% 透明度作为底图）</label>';
  h+='<input type="file" id="bgFile" accept="image/*">';
  if(todayBgImg){
    h+='<div style="margin-top:6px;border-radius:10px;overflow:hidden;background:#f0f0f3">';
    h+='<img src="'+todayBgImg+'" style="width:100%;display:block;opacity:.6">';
    h+='</div>';
    h+='<button class="btn o" id="bgClear" style="margin-top:10px;color:#c33">移除背景图</button>';
  }
  h+='<div class="muted" style="margin-top:8px">在「统计」页的今日画画卡片上点一下，可全屏显示背景图 5 秒，然后自动恢复。</div>';
  h+='</div>';

  h+='<button class="btn o" id="expBtn">一键导出所有数据</button>';
  h+='<button class="btn o" id="impBtn">一键导入数据</button>';
  var totalImgs=0;
  DB.works.forEach(function(w){totalImgs+=workImgCount(w)});
  h+='<div class="card"><h3>存储</h3><div class="muted">作品 '+DB.works.length+' 个 · 图片 '+totalImgs+' 张<br>使用 IndexedDB，容量大，可存原图</div></div>';
  h+='<div class="card"><h3>说明</h3><div class="muted">图片按原图保存。导出文件为 JSON 格式，包含所有分类、作品、图片、打卡、计划、卡片背景。换手机时用「导入数据」恢复即可。</div></div>';
  view.innerHTML=h;
  document.getElementById('addCat').onclick=addCategoryModal;
  document.getElementById('expBtn').onclick=exportAll;
  document.getElementById('impBtn').onclick=importAll;

  var bgFile=document.getElementById('bgFile');
  if(bgFile)bgFile.onchange=function(e){
    var f=e.target.files[0];
    if(!f)return;
    processImage(f).then(function(d){
      todayBgImg=d;
      idbPut('settings',{id:'todayBg',img:d}).then(function(){
        closeModal();
        toast('背景已设置');
        renderSettings();
      });
    });
  };
  var bgClear=document.getElementById('bgClear');
  if(bgClear)bgClear.onclick=function(){
    if(!confirm('移除今日画画卡片的背景图？'))return;
    todayBgImg=null;
    idbDel('settings','todayBg').then(function(){toast('已移除');renderSettings();});
  };

  view.querySelectorAll('[data-delcat]').forEach(function(b){b.onclick=function(){
    if(!confirm('删除这个分类？该分类下的作品不会被删除，只影响分类本身。'))return;
    var id=Number(b.dataset.delcat);
    idbDel('categories',id).then(function(){
      DB.categories=DB.categories.filter(function(c){return Number(c.id)!==id});
      toast('已删除');renderSettings();
    });
  }});
}
function exportAll(){
  var pack={version:1,exportedAt:new Date().toISOString(),categories:DB.categories,works:DB.works,checkins:DB.checkins,checkinLogs:DB.checkinLogs,plans:DB.plans,todayBgImg:todayBgImg};
  var blob=new Blob([JSON.stringify(pack)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='draw-backup-'+today()+'.json';a.click();toast('已导出');
}
function importAll(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(!confirm('导入会覆盖当前所有数据，确定继续？'))return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var pack=JSON.parse(rd.result);
        var stores=['categories','works','checkins','checkinLogs','plans','settings'];
        Promise.all(stores.map(function(s){return idbClear(s)})).then(function(){
          DB.categories=pack.categories||[];DB.works=pack.works||[];DB.checkins=pack.checkins||[];DB.checkinLogs=pack.checkinLogs||[];DB.plans=pack.plans||[];
          todayBgImg=pack.todayBgImg||null;
          var ps=[];
          DB.categories.forEach(function(c){ps.push(idbPut('categories',c))});
          DB.works.forEach(function(w){ps.push(idbPut('works',w))});
          DB.checkins.forEach(function(c){ps.push(idbPut('checkins',c))});
          DB.checkinLogs.forEach(function(c){ps.push(idbPut('checkinLogs',c))});
          DB.plans.forEach(function(c){ps.push(idbPut('plans',c))});
          if(todayBgImg)ps.push(idbPut('settings',{id:'todayBg',img:todayBgImg}));
          Promise.all(ps).then(function(){toast('导入完成');go('collections');});
        });
      }catch(err){toast('文件格式错误')}
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* 图片点击：无操作 */
function showImg(src){}

openIDB().then(function(){
  return Promise.all([idbAll('categories'),idbAll('works'),idbAll('checkins'),idbAll('checkinLogs'),idbAll('plans'),idbAll('settings')]);
}).then(function(r){
  DB.categories=r[0]||[];DB.works=r[1]||[];DB.checkins=r[2]||[];DB.checkinLogs=r[3]||[];DB.plans=r[4]||[];
  var st=(r[5]||[]).filter(function(x){return x.id==='todayBg'})[0];
  todayBgImg=st?st.img:null;
  if(!DB.categories.length){
    var defs=['练习','创作','速写','长期作品'];
    var ps=[];
    defs.forEach(function(n){var c={id:uid(),name:n};DB.categories.push(c);ps.push(idbPut('categories',c));});
    return Promise.all(ps);
  }
}).then(function(){
  go('collections');
}).catch(function(e){
  document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif">数据库初始化失败：'+e.message+'</div>';
});
</script>
