<style>

<script>
var DB={categories:[],works:[],checkins:[],checkinLogs:[],plans:[]};
var state={tab:'collections',category:null,workId:null,workImgIdx:0,planId:null,nodeIdx:0,statRange:'week',calMonth:new Date(),openCheckin:null,ckFoldOpen:false,planFoldOpen:false,q:'',stars:[]};
var view=document.getElementById('view'),titleEl=document.getElementById('title'),backEl=document.getElementById('back'),actionEl=document.getElementById('action');
var todayBgImg=null,todayShowTimer=null;
var viewerImgs=[],viewerIdx=0,viewerSyncWork=false;
var idb=null;

function openIDB(){return new Promise(function(res,rej){var req=indexedDB.open('draw_idb',2);
  req.onupgradeneeded=function(e){var d=e.target.result;['categories','works','checkins','checkinLogs','plans','settings'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});};
  req.onsuccess=function(e){idb=e.target.result;res();};req.onerror=function(e){rej(e.target.error);};});}
function tx(s,m){return idb.transaction(s,m||'readonly').objectStore(s);}
function idbAll(s){return new Promise(function(res,rej){var r=tx(s).getAll();r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbPut(s,o){return new Promise(function(res,rej){var r=tx(s,'readwrite').put(o);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}
function idbDel(s,id){return new Promise(function(res,rej){var r=tx(s,'readwrite').delete(id);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}
function idbClear(s){return new Promise(function(res,rej){var r=tx(s,'readwrite').clear();r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}

function uid(){return Date.now()+Math.floor(Math.random()*100000)}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtTs(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDur(m){m=Math.round(m||0);if(m<60)return m+'分';var h=Math.floor(m/60),mm=m%60;return mm?h+'时'+mm+'分':h+'时'}
function fmtDurCal(m){m=Math.round(m||0);if(m<60)return m+'min';var h=Math.floor(m/60),mm=m%60;return mm?h+'h'+mm+'min':h+'h';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999';document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}

function bindTapAndDoubleTap(el,onSingle,onDouble){
  var lastTap=0,timer=null;
  function handler(e){if(e){e.preventDefault();e.stopPropagation();}var now=Date.now();
    if(now-lastTap<320){if(timer){clearTimeout(timer);timer=null;}lastTap=0;if(navigator.vibrate){try{navigator.vibrate(30)}catch(_){}}onDouble();}
    else{lastTap=now;if(timer)clearTimeout(timer);timer=setTimeout(function(){timer=null;lastTap=0;onSingle();},300);}}
  el.addEventListener('pointerup',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;handler(e);});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
  el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation()});
}

/* ===== 全屏图片查看器 ===== */
function openImageViewer(imgs,idx,syncWork){viewerImgs=imgs||[];viewerIdx=idx||0;viewerSyncWork=!!syncWork;renderViewer();document.getElementById('imgViewerMask').classList.add('on');}
function renderViewer(){
  var mask=document.getElementById('imgViewerMask'),imgEl=document.getElementById('imgViewerImg'),
      prev=document.getElementById('ivPrev'),next=document.getElementById('ivNext'),counter=document.getElementById('ivCounter');
  if(!viewerImgs.length){mask.classList.remove('on');return}
  if(viewerIdx<0)viewerIdx=0;if(viewerIdx>viewerImgs.length-1)viewerIdx=viewerImgs.length-1;
  imgEl.src=viewerImgs[viewerIdx];
  var multi=viewerImgs.length>1;
  prev.style.display=multi?'flex':'none';next.style.display=multi?'flex':'none';counter.style.display=multi?'block':'none';
  prev.disabled=viewerIdx===0;next.disabled=viewerIdx===viewerImgs.length-1;
  counter.textContent=(viewerIdx+1)+' / '+viewerImgs.length;
}
function closeImageViewer(){
  var sync=viewerSyncWork,lastIdx=viewerIdx;
  document.getElementById('imgViewerMask').classList.remove('on');
  viewerImgs=[];viewerIdx=0;viewerSyncWork=false;
  if(sync&&state.workId){state.workImgIdx=lastIdx;renderWorkView();}
}
document.getElementById('ivClose').onclick=function(e){e.stopPropagation();closeImageViewer();};
document.getElementById('ivPrev').onclick=function(e){e.stopPropagation();if(viewerIdx>0){viewerIdx--;renderViewer();}};
document.getElementById('ivNext').onclick=function(e){e.stopPropagation();if(viewerIdx<viewerImgs.length-1){viewerIdx++;renderViewer();}};
document.getElementById('imgViewerMask').addEventListener('click',function(e){

function workTotal(w){if(!w.stages||!w.stages.length)return 0;return w.stages[w.stages.length-1].cumulative||0}
function stageDur(w,i){var prev=i===0?0:(w.stages[i-1].cumulative||0);return (w.stages[i].cumulative||0)-prev}
function workCover(w){if(!w.stages||!w.stages.length)return null;
  for(var i=w.stages.length-1;i>=0;i--){var imgs=w.stages[i].images;if(imgs&&imgs.length)return imgs[imgs.length-1];}return null;}
function workImgCount(w){var n=0;(w.stages||[]).forEach(function(s){n+=(s.images||[]).length});return n}
function workCreatedAt(w){if(w.createdAt)return w.createdAt;
  if(w.stages&&w.stages.length&&w.stages[0].date)return new Date(w.stages[0].date+'T00:00:00').getTime();return null;}
function getAllWorkImages(w){var a=[];(w.stages||[]).forEach(function(s){(s.images||[]).forEach(function(im){a.push(im)})});return a;}

function getAutoAssignedWorks(plan,allWorks){
  var assigned=plan.nodes.map(function(n){return{node:n,works:[],totalMin:0};});
  var targetWorks=allWorks.filter(function(w){return String(w.planId)===String(plan.id);});
  targetWorks.sort(function(a,b){return (workCreatedAt(a)||0)-(workCreatedAt(b)||0);});
  var ci=0,acc=0;
  targetWorks.forEach(function(w){
    var wt=workTotal(w);
    if(ci<assigned.length){
      var node=assigned[ci],target=(node.node.hours||0)*60;
      if(acc>0&&target>0&&acc+wt>target){ci++;acc=0;if(ci>=assigned.length)return;}
      assigned[ci].works.push(w);assigned[ci].totalMin+=wt;acc+=wt;
    }
  });
  return assigned;
}
function starsHTML(rating,small,nomb){
  var cls='stars'+(small?' sm':'')+(nomb?' nomb':'');
  var h='<div class="'+cls+'">';
  for(var i=1;i<=5;i++)h+='<span data-v="'+i+'" class="'+(i<=rating?'on':'')+'">★</span>';
  return h+'</div>';
}
function processImage(file){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(e){res(e.target.result);};rd.onerror=rej;rd.readAsDataURL(file);});}
function openModal(title,body,footer){

  if(footer)h+='<div class="modal-f">'+footer+'</div>';

  document.getElementById('modalRoot').innerHTML=h;

}

/* ===== 作品详情 ===== */
function renderWorkView(){
  var w=DB.works.find(function(x){return x.id===state.workId});
  if(!w){state.workId=null;renderCategoryView();return}
  titleEl.textContent='作品';backEl.style.display='block';actionEl.style.display='none';
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
    +starsHTML(w.rating||0,false,true)+'<button class="work-menu-btn" id="workMenu">⋯</button></div>';
  var ca=workCreatedAt(w);
  if(ca)h+='<div class="muted" style="margin-top:10px">添加于 '+fmtTs(ca)+'</div>';
  if(w.planId){var p=DB.plans.find(function(x){return Number(x.id)===Number(w.planId)});if(p)h+='<div class="muted" style="margin-top:4px">计划：'+esc(p.name)+'（自动分配）</div>';}
  if(w.note)h+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f2f2f5;white-space:pre-wrap">'+esc(w.note)+'</div>';
  h+='</div>';

  var imgList=[];
  (w.stages||[]).forEach(function(s,i){
    var prev=i===0?0:(w.stages[i-1].cumulative||0),dur=(s.cumulative||0)-prev;
    (s.images||[]).forEach(function(img){imgList.push({img:img,stageIdx:i,dur:dur,cumulative:s.cumulative,note:s.note||'',date:s.date||''});});
  });
  imgList.reverse();

  if(imgList.length){
    if(state.workImgIdx<0)state.workImgIdx=0;
    if(state.workImgIdx>imgList.length-1)state.workImgIdx=imgList.length-1;
    var cur=imgList[state.workImgIdx];
    h+='<div class="img-viewer"><div class="img-nav"><button id="imgPrev"'+(state.workImgIdx===0?' disabled':'')+'>◀</button>'
      +'<div class="img-counter">'+(state.workImgIdx+1)+' / '+imgList.length+'</div>'
      +'<button id="imgNext"'+(state.workImgIdx===imgList.length-1?' disabled':'')+'>▶</button></div>'
      +'<div class="img-stage-info">阶段 '+(cur.stageIdx+1)+' · 用时 '+fmtDur(cur.dur)+' · 累计 '+fmtDur(cur.cumulative)+(cur.date?' · '+esc(cur.date):'');
    if(cur.note)h+='<div class="note">'+esc(cur.note)+'</div>';
    h+='</div><div class="img-big"><img src="'+cur.img+'" id="workBigImg" title="点击查看大图"></div></div>';
  }else h+='<div class="empty">还没有图片</div>';
  view.innerHTML=h;

  var prevBtn=document.getElementById('imgPrev'),nextBtn=document.getElementById('imgNext');
  if(prevBtn)prevBtn.onclick=function(){if(state.workImgIdx>0){state.workImgIdx--;renderWorkView();}};
  if(nextBtn)nextBtn.onclick=function(){if(state.workImgIdx<imgList.length-1){state.workImgIdx++;renderWorkView();}};
  var big=document.getElementById('workBigImg');
  if(big)big.onclick=function(){openImageViewer(imgList.map(function(x){return x.img}),state.workImgIdx,true);};

  var starsEl=view.querySelector('.stars');
  starsEl.querySelectorAll('span').forEach(function(s){
    s.onclick=function(){w.rating=Number(s.dataset.v);idbPut('works',w).then(function(){renderWorkView();});};
  });
  document.getElementById('workMenu').onclick=function(){
    openModal('作品操作','<button class="btn" id="wedit" style="margin-bottom:10px">编辑作品</button><button class="btn o" id="wdel" style="color:#c33">删除作品</button>','<button class="btn o" data-close>取消</button>');
    document.getElementById('wedit').onclick=function(){closeModal();addWorkModal(w,w.category)};
    document.getElementById('wdel').onclick=function(){
      if(!confirm('确定删除这个作品？'))return;
      idbDel('works',w.id).then(function(){
        DB.works=DB.works.filter(function(x){return x.id!==w.id});
        closeModal();toast('已删除');state.workId=null;state.workImgIdx=0;renderCategoryView();
      });
    };

function addWorkModal(work,category){
  var editing=!!work,rating=work?work.rating:0,newFiles=[];
  var defH=editing?'':'1',defM=editing?'':'30';
  var body='<label class="fld">分类</label><select id="wf-cat">';
  DB.categories.forEach(function(c){body+='<option value="'+esc(c.name)+'"'+(c.name===category?' selected':'')+'>'+esc(c.name)+'</option>'});
  body+='</select><label class="fld">评分（必填）</label>'+starsHTML(rating,false).replace('class="stars"','class="stars" id="wf-stars"');
  if(DB.plans.length){
    body+='<label class="fld">加入计划（可选，按时间自动分配节点）</label><select id="wf-plan"><option value="">不加入计划</option>';
    DB.plans.forEach(function(p){body+='<option value="'+p.id+'"'+(work&&String(work.planId)===String(p.id)?' selected':'')+'>'+esc(p.name)+'</option>'});
    body+='</select>';
  }
  body+='<label class="fld">作品备注（可选）</label><textarea id="wf-note" placeholder="整体想法、感受">'+(work?esc(work.note||''):'')+'</textarea>';
  if(editing&&work.stages&&work.stages.length){
    body+='<div class="existing-stages"><div class="muted" style="margin-bottom:8px;font-weight:500">已有阶段（可编辑、删除）</div>';
    work.stages.forEach(function(stage,idx){
      var prevCum=idx===0?0:(work.stages[idx-1].cumulative||0),dur=(stage.cumulative||0)-prevCum;
      body+='<div class="existing-stage-row"><div class="existing-stage-label">阶段 '+(idx+1)+' · '+fmtDur(dur)+' · 累计 '+fmtDur(stage.cumulative)+(stage.note?' · '+esc(stage.note):'')+'</div>';
      if(stage.images&&stage.images.length){
        body+='<div class="existing-stage-thumbs">';
        stage.images.forEach(function(img,i){body+='<img src="'+img+'" data-stageimg="'+idx+'_'+i+'">'});
        body+='</div>';
      }
      body+='<div class="stage-btn-row"><button class="btn o" id="stage-edit-btn-'+idx+'" type="button">编辑</button>'
        +'<button class="btn o" id="stage-del-btn-'+idx+'" type="button" style="color:#c33">删除</button></div></div>';
    });
    body+='</div>';
  }
  if(editing)body+='<div class="muted" style="margin:10px 0 8px;font-weight:500">添加新阶段（可选）</div>';
  body+='<label class="fld">图片（可多选，不限张数，按原图保存）</label><input type="file" id="wf-file" accept="image/*" multiple><div id="wf-prev" class="grid34" style="margin-top:10px"></div>';
  body+='<label class="fld">'+(editing?'新阶段累计总时长':'累计总时长')+'</label>';
  body+='<div class="dur-row"><input type="number" id="wf-h" min="0" placeholder="时" value="'+defH+'"><span class="lbl">时</span><input type="number" id="wf-m" min="0" max="59" placeholder="分" value="'+defM+'"><span class="lbl">分</span></div>';
  body+='<label class="fld">日期</label><input type="date" id="wf-date" value="'+today()+'">';
  body+='<label class="fld">阶段备注（可选）</label><textarea id="wf-snote"></textarea>';
  openModal(editing?'编辑作品':'添加作品',body,'<button class="btn o" data-close>取消</button><button class="btn" id="wf-save">保存</button>');

  var starsEl=document.getElementById('wf-stars');
  starsEl.querySelectorAll('span').forEach(function(s){
    s.onclick=function(){rating=Number(s.dataset.v);starsEl.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',Number(x.dataset.v)<=rating)});};
  });
  document.querySelectorAll('[data-stageimg]').forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      var parts=el.dataset.stageimg.split('_'),sIdx=Number(parts[0]),iIdx=Number(parts[1]);
      var stageImgs=(work.stages[sIdx]&&work.stages[sIdx].images)?work.stages[sIdx].images:[];
      openImageViewer(stageImgs,iIdx,false);
    };
  });
  if(editing&&work.stages){
    work.stages.forEach(function(stage,idx){
      var eb=document.getElementById('stage-edit-btn-'+idx);
      if(eb)eb.onclick=function(e){e.preventDefault();e.stopPropagation();openEditStageModal(work,idx);};
      var db=document.getElementById('stage-del-btn-'+idx);
      if(db)db.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        if(!confirm('确定删除阶段 '+(idx+1)+'？后续阶段的累计时长会自动调整。'))return;
        var removedDur=stageDur(work,idx);
        work.stages.splice(idx,1);
        for(var i=idx;i<work.stages.length;i++)work.stages[i].cumulative=(work.stages[i].cumulative||0)-removedDur;
        idbPut('works',work).then(function(){toast('阶段已删除');closeModal();addWorkModal(work,work.category);});
      };
    });
  }
  var planSel=document.getElementById('wf-plan');
  document.getElementById('wf-file').onchange=function(e){
    newFiles=[].slice.call(e.target.files);
    var p=document.getElementById('wf-prev');p.innerHTML='';
    newFiles.forEach(function(f){var rd=new FileReader();rd.onload=function(ev){var d=document.createElement('div');d.className='cell';d.innerHTML='<img src="'+ev.target.result+'">';p.appendChild(d)};rd.readAsDataURL(f);});
  };
  document.getElementById('wf-save').onclick=function(){
    if(!rating){toast('请先评分');return}
    var cat=document.getElementById('wf-cat').value,note=document.getElementById('wf-note').value.trim(),planId=null;
    if(planSel&&planSel.value)planId=Number(planSel.value);
    if(editing){
      work.category=cat;work.note=note;work.planId=planId;work.rating=rating;
      if(newFiles.length){
        var cum=(parseInt(document.getElementById('wf-h').value)||0)*60+(parseInt(document.getElementById('wf-m').value)||0);
        var date=document.getElementById('wf-date').value||today(),snote=document.getElementById('wf-snote').value.trim();
        var lastCum=workTotal(work);
        if(cum<=lastCum){toast('新累计时长须大于 '+fmtDur(lastCum));return}
        var done=0,newImages=[];
        newFiles.forEach(function(f){
          processImage(f).then(function(d){
            newImages.push(d);done++;
            if(done===newFiles.length){
              work.stages.push({images:newImages,cumulative:cum,date:date,note:snote});
              idbPut('works',work).then(function(){closeModal();toast('已保存');renderWorkView();});
            }
          });
        });
      }else idbPut('works',work).then(function(){closeModal();toast('已保存');renderWorkView();});
    }else{
      if(!newFiles.length){toast('请选择图片');return}
      var cum2=(parseInt(document.getElementById('wf-h').value)||0)*60+(parseInt(document.getElementById('wf-m').value)||0);
      if(cum2<=0){toast('请输入累计时长');return}
      var date2=document.getElementById('wf-date').value||today(),snote2=document.getElementById('wf-snote').value.trim();
      var done2=0,images=[];
      newFiles.forEach(function(f){
        processImage(f).then(function(d){
          images.push(d);done2++;
          if(done2===newFiles.length){
            var nw={id:uid(),category:cat,rating:rating,planId:planId,note:note,createdAt:Date.now(),stages:[{images:images,cumulative:cum2,date:date2,note:snote2}]};
            DB.works.push(nw);
            idbPut('works',nw).then(function(){closeModal();toast('已添加');renderCategoryView();});
          }
        });
      });
    }
  };
}

/* ===== 编辑阶段 ===== */
function openEditStageModal(work,idx){
  var stage=work.stages[idx];if(!stage)return;
  var prevCum=idx===0?0:(work.stages[idx-1].cumulative||0),oldDur=(stage.cumulative||0)-prevCum;
  var oldH=Math.floor(oldDur/60),oldM=oldDur%60;
  var body='<label class="fld">本阶段用时（不能小于原来，可留空不改）</label>'
    +'<div class="dur-row"><input type="number" id="edit-h" min="0" placeholder="时" value="'+oldH+'"><span class="lbl">时</span><input type="number" id="edit-m" min="0" max="59" placeholder="分" value="'+oldM+'"><span class="lbl">分</span></div>'
    +'<div class="muted" style="margin-top:-6px;margin-bottom:12px">原用时：'+fmtDur(oldDur)+'</div>'
    +'<label class="fld">日期</label><input type="date" id="edit-date" value="'+(stage.date||today())+'">'
    +'<label class="fld">备注</label><textarea id="edit-note">'+esc(stage.note||'')+'</textarea>';
  openModal('编辑阶段 '+(idx+1),body,'<button class="btn o" data-close>取消</button><button class="btn" id="edit-save">保存</button>');
  document.getElementById('edit-save').onclick=function(){
    var hVal=document.getElementById('edit-h').value.trim(),mVal=document.getElementById('edit-m').value.trim();
    var newDate=document.getElementById('edit-date').value,newNote=document.getElementById('edit-note').value.trim();
    var same=(String(oldH)===hVal||(oldH===0&&hVal===''))&&(String(oldM)===mVal||(oldM===0&&mVal===''));
    if(!same&&(hVal!==''||mVal!=='')){
      var newDur=(parseInt(hVal)||0)*60+(parseInt(mVal)||0);
      if(newDur<oldDur){toast('本阶段用时不能小于 '+fmtDur(oldDur));return}
      var diff=newDur-oldDur;
      stage.cumulative=(stage.cumulative||0)+diff;
      for(var i=idx+1;i<work.stages.length;i++)work.stages[i].cumulative=(work.stages[i].cumulative||0)+diff;
    }
    stage.date=newDate;stage.note=newNote;
    idbPut('works',work).then(function(){closeModal();toast('阶段已更新');setTimeout(function(){closeModal();addWorkModal(work,work.category);},100);});
  };
}

function streakCount(logs){
  if(!logs.length)return 0;
  var set={};logs.forEach(function(d){set[d]=1});
  var cur=new Date();
  if(!set[fmtDate(cur)])cur.setDate(cur.getDate()-1);
  var n=0;
  while(set[fmtDate(cur)]){n++;cur.setDate(cur.getDate()-1)}
  return n;
}

function pickCover(p,nodeId){

function renderStats(){
  titleEl.textContent='统计';backEl.style.display='none';actionEl.style.display='none';
  if(!DB.works.length&&!DB.checkins.length){view.innerHTML='<div class="empty">还没有数据</div>';return}
  var allStages=[];
  DB.works.forEach(function(w){w.stages.forEach(function(s,i){allStages.push({date:s.date,duration:stageDur(w,i),category:w.category});});});
  var td=today();
  var todayMin=allStages.filter(function(s){return s.date===td}).reduce(function(a,s){return a+s.duration},0);
  var allMin=allStages.reduce(function(a,s){return a+s.duration},0);
  var hasBg=!!todayBgImg;
  var h='<div class="card today-card'+(hasBg?' has-bg':'')+'" id="todayCard">';
  if(hasBg)h+='<div class="today-bg" style="background-image:url(\''+todayBgImg+'\')"></div>';
  h+='<div class="today-content"><div class="today-label">今日画画</div><div class="today-value">'+fmtDur(todayMin)+'</div>'
    +'<div class="today-total">总绘画时长 '+fmtDur(allMin)+'</div></div></div>';
  h+=renderImageCalendar();

  var h2='<div class="seg">';
  [['week','周'],['month','月'],['year','年']].forEach(function(r){h2+='<button data-r="'+r[0]+'"'+(state.statRange===r[0]?' class="on"':'')+'>'+r[1]+'</button>';});
  h2+='</div>';
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var pts=[],total=0,title='',avgLabel='',avgVal=0,avgNote='';
  if(state.statRange==='week'){
    title='本周每天时长';
    var ws=new Date(now),day=(ws.getDay()+6)%7;ws.setDate(ws.getDate()-day);
    for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      var v=allStages.filter(function(s){return s.date===ds}).reduce(function(a,s){return a+s.duration},0);pts.push({l:['一','二','三','四','五','六','日'][i],v:v});total+=v;}
    var dp=day+1;avgLabel='平均每天';avgVal=total/dp;if(dp<7)avgNote='已过 '+dp+' 天';
  }else if(state.statRange==='month'){
    title='本月每天时长';
    var days=new Date(y,m+1,0).getDate();
    for(var d2=1;d2<=days;d2++){var ds2=y+'-'+pad(m+1)+'-'+pad(d2);
      var v2=allStages.filter(function(s){return s.date===ds2}).reduce(function(a,s){return a+s.duration},0);pts.push({l:String(d2),v:v2});total+=v2;}
    var dp2=now.getDate();avgLabel='平均每周';avgVal=total*7/dp2;if(dp2<days)avgNote='已过 '+dp2+' 天';
  }else{
    title='本年每月时长';
    for(var mm=1;mm<=12;mm++){var pre=y+'-'+pad(mm);
      var v3=allStages.filter(function(s){return (s.date||'').slice(0,7)===pre}).reduce(function(a,s){return a+s.duration},0);pts.push({l:mm+'月',v:v3});total+=v3;}
    var mp=now.getMonth()+1;avgLabel='平均每月';avgVal=total/mp;if(mp<12)avgNote='已过 '+mp+' 个月';
  }
  h2+='<div class="card"><h3>'+title+'</h3><div class="muted" style="margin-bottom:6px;line-height:1.7">合计 '+fmtDur(total)+'<br>'+avgLabel+' '+fmtDur(avgVal)+(avgNote?'（'+avgNote+'）':'')+'</div>'+lineChart(pts)+'</div>';
  var cat={};allStages.forEach(function(s){var k=s.category||'未分类';cat[k]=(cat[k]||0)+s.duration});
  var ca=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]});
  var cm=Math.max(1,Math.max.apply(null,ca.map(function(k){return cat[k]})));
  h2+='<div class="card"><h3>分类汇总</h3>';
  ca.forEach(function(k){h2+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+esc(k)+'</span><span class="muted">'+fmtDur(cat[k])+'</span></div><div class="bar"><i style="width:'+(cat[k]/cm*100)+'%"></i></div></div>';});
  h2+='</div>';

  /* 检索卡片 */
  h2+='<div class="card"><h3>检索作品</h3><div class="search-bar">'
    +'<input id="searchInput" type="search" placeholder="搜索备注 / 分类 / 阶段备注 / 日期" value="'+esc(state.q||'')+'">'
    +'<button class="btn sm o" id="searchClear" type="button" style="flex-shrink:0">清空</button></div>'
    +'<div class="chip-row" id="starChips"><button class="chip'+(state.stars.length===0?' on':'')+'" data-star="0" type="button">全部</button>';
  for(var s=5;s>=1;s--)h2+='<button class="chip'+(state.stars.indexOf(s)>=0?' on':'')+'" data-star="'+s+'" type="button">'+s+'★</button>';
  h2+='</div><div id="searchResults"></div></div>';

  view.innerHTML=h+h2;
  view.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){state.statRange=b.dataset.r;renderStats()}});
  bindCalendarEvents();
  bindSearchEvents();
  renderSearchResults();

  var tc=document.getElementById('todayCard');
  if(tc&&hasBg){
    tc.onclick=function(){
      tc.classList.add('show-bg');
      if(todayShowTimer)clearTimeout(todayShowTimer);
      todayShowTimer=setTimeout(function(){tc.classList.remove('show-bg');todayShowTimer=null;},5000);
    };
  }
}
function bindSearchEvents(){
  var inp=document.getElementById('searchInput');
  if(inp){
    var t=null;
    inp.oninput=function(){state.q=inp.value;if(t)clearTimeout(t);t=setTimeout(function(){t=null;renderSearchResults();},180);};
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();try{inp.blur()}catch(_){}}};
  }
  var cb=document.getElementById('searchClear');
  if(cb)cb.onclick=function(){state.q='';state.stars=[];var i2=document.getElementById('searchInput');if(i2)i2.value='';syncStarChips();renderSearchResults();};
  var chips=document.getElementById('starChips');
  if(chips)chips.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){
      var v=Number(c.dataset.star);
      if(v===0)state.stars=[];
      else{var idx=state.stars.indexOf(v);if(idx>=0)state.stars.splice(idx,1);else state.stars.push(v);state.stars.sort();}
      syncStarChips();renderSearchResults();
    };
  });
}
function syncStarChips(){
  var chips=document.getElementById('starChips');if(!chips)return;
  chips.querySelectorAll('.chip').forEach(function(x){
    var xv=Number(x.dataset.star);
    if(xv===0)x.classList.toggle('on',state.stars.length===0);
    else x.classList.toggle('on',state.stars.indexOf(xv)>=0);
  });
}
function filterWorks(){
  var q=(state.q||'').trim().toLowerCase(),stars=state.stars||[];
  return DB.works.filter(function(w){
    var r=Number(w.rating)||0;
    if(stars.length&&stars.indexOf(r)<0)return false;
    if(!q)return true;
    var hay=(w.note||'')+' '+(w.category||'');
    (w.stages||[]).forEach(function(s){hay+=' '+(s.note||'')+' '+(s.date||'');});
    return hay.toLowerCase().indexOf(q)>=0;
  });
}
function renderSearchResults(){
  var box=document.getElementById('searchResults');if(!box)return;
  var q=(state.q||'').trim(),stars=state.stars||[];
  var list=filterWorks();
  list.sort(function(a,b){return (workCreatedAt(b)||0)-(workCreatedAt(a)||0);});
  var cond=[];
  if(q)cond.push('“'+q+'”');
  if(stars.length)cond.push(stars.join('、')+'★');
  var head=cond.length?('匹配 '+cond.join(' + ')+' · 共 '+list.length+' 个'):('全部作品 · 共 '+list.length+' 个');
  var h='<div class="muted" style="margin-top:12px;font-weight:500">'+esc(head)+'</div>';
  if(!list.length){box.innerHTML=h+'<div class="empty" style="padding:24px 10px">没有匹配的作品</div>';return}
  h+='<div class="timeline">';
  list.forEach(function(w){
    var imgs=getAllWorkImages(w),ca=workCreatedAt(w);
    var dateStr=ca?fmtTs(ca):'未知时间';
    h+='<div class="tl-item"><div class="tl-date" data-tlwork="'+w.id+'">'+esc(dateStr)+(w.category?' · '+esc(w.category):'')+'</div>'
      +'<div class="tl-card"><div class="tl-top">'+starsHTML(w.rating||0,true,true)+'<span class="muted">'+fmtDur(workTotal(w))+'</span></div>';
    if(imgs.length){
      h+='<div class="tl-thumbs">';
      imgs.forEach(function(im,i){h+='<img src="'+im+'" data-tlimg="'+w.id+'_'+i+'">'});
      h+='</div>';
    }
    if(w.note)h+='<div class="tl-note">'+esc(w.note)+'</div>';
    h+='</div></div>';
  });
  box.innerHTML=h+'</div>';

  box.querySelectorAll('[data-tlimg]').forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      var parts=el.dataset.tlimg.split('_'),wid=Number(parts[0]),idx=Number(parts[1]);
      var w=DB.works.find(function(x){return x.id===wid});if(!w)return;
      openImageViewer(getAllWorkImages(w),idx,false);
    };
  });
  box.querySelectorAll('[data-tlwork]').forEach(function(el){
    el.onclick=function(e){e.stopPropagation();openWorkFromSearch(Number(el.dataset.tlwork));};
  });
}
function openWorkFromSearch(id){
  var w=DB.works.find(function(x){return x.id===id});if(!w)return;
  state.tab='collections';state.category=w.category;state.workId=id;state.workImgIdx=0;state.planId=null;
  renderTabs();renderWorkView();
}

function renderImageCalendar(){
  var d=state.calMonth,y=d.getFullYear(),m=d.getMonth(),dayData={};
  DB.works.forEach(function(w){
    w.stages.forEach(function(s,i){
      if(!s.date)return;
      if(s.date.slice(0,7)!==y+'-'+pad(m+1))return;
      if(!dayData[s.date])dayData[s.date]={works:0,dur:0};
      dayData[s.date].dur+=stageDur(w,i);
      if(s.images&&s.images.length)dayData[s.date].works+=1;
    });
  });
  var first=new Date(y,m,1),sp=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';
  ['一','二','三','四','五','六','日'].forEach(function(w){cells+='<div class="w">'+w+'</div>'});
  for(var i=0;i<sp;i++)cells+='<div></div>';
  var td=today();
  for(var day=1;day<=days;day++){
    var ds=y+'-'+pad(m+1)+'-'+pad(day),info=dayData[ds];
    var dur=info&&info.dur>0?info.dur:0,wk=info&&info.works>0?info.works:0,has=dur>0||wk>0;
    cells+='<div class="d'+(has?' has':'')+(ds===td?' today':'')+'" data-calday="'+ds+'">'
      +'<span class="n">'+(wk>0?wk:'')+'</span><span class="dd">'+day+'</span>'
      +'<span class="dur">'+(dur>0?fmtDurCal(dur):'')+'</span></div>';
  }
  return '<div class="card cal-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="btn sm o" data-cal="prev">‹</button><strong>'+y+'年'+(m+1)+'月</strong><button class="btn sm o" data-cal="next">›</button></div><div class="cal">'+cells+'</div></div>';
}
function bindCalendarEvents(){
  view.querySelectorAll('[data-cal]').forEach(function(b){
    b.onclick=function(){
      var d=new Date(state.calMonth);
      d.setMonth(d.getMonth()+(b.dataset.cal==='prev'?-1:1));
      state.calMonth=d;renderStats();
    };
  });
  view.querySelectorAll('[data-calday]').forEach(function(el){el.onclick=function(){showDayImages(el.dataset.calday)}});
}
function showDayImages(ds){
  var imgs=[],totalMin=0;
  DB.works.forEach(function(w){
    w.stages.forEach(function(s,i){
      if(s.date===ds){(s.images||[]).forEach(function(img){imgs.push(img)});totalMin+=stageDur(w,i);}
    });
  });
  var h='<div class="muted" style="margin-bottom:10px">'+ds+' · 总绘制 '+fmtDur(totalMin)+' · 点图片可看大图</div>';
  if(!imgs.length)h+='<div class="empty">这一天没有图片</div>';
  else{h+='<div class="grid34">';imgs.forEach(function(img,i){h+='<div class="cell" data-dayimg="'+i+'"><img src="'+img+'"></div>'});h+='</div>'}
  openModal(ds+' 的图片（'+imgs.length+'）',h,'<button class="btn o" data-close>关闭</button>');
  document.querySelectorAll('[data-dayimg]').forEach(function(el){
    el.onclick=function(e){e.stopPropagation();openImageViewer(imgs,Number(el.dataset.dayimg),false);};
  });
}
function lineChart(pts){
  var W=340,H=130,PL=32,PR=12,PT=14,PB=24,n=pts.length;
  var max=Math.max(1,Math.max.apply(null,pts.map(function(p){return p.v})));
  var nm=Math.ceil(max/60)*60||60,sx=n>1?(W-PL-PR)/(n-1):0;
  var ps=pts.map(function(p,i){return{x:PL+i*sx,y:H-PB-(p.v/nm)*(H-PT-PB),v:p.v,l:p.l}});
  var line=ps.map(function(p,i){return(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ');
  var area=line+' L '+ps[n-1].x.toFixed(1)+' '+(H-PB)+' L '+ps[0].x.toFixed(1)+' '+(H-PB)+' Z',grid='';
  for(var g=0;g<=2;g++){var y=PT+(H-PT-PB)*g/2,valMin=nm*(1-g/2),val=(valMin/60).toFixed(valMin%60===0?0:1)+'h';
    grid+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#d0d0d8"/><text x="'+(PL-6)+'" y="'+(y+3)+'" font-size="9" fill="#a0a0a8" text-anchor="end">'+val+'</text>';}
  var dots=ps.map(function(p){return'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>'}).join('');
  var lbs=ps.map(function(p,i){if(n>12&&i%2!==0)return'';return'<text x="'+p.x+'" y="'+(H-9)+'" font-size="9" fill="#999" text-anchor="middle">'+p.l+'</text>'}).join('');
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+'<path d="'+area+'" fill="#1a1a1a" opacity="0.08"/><path d="'+line+'" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>'+dots+lbs+'</svg>';
}

/* ===== 设置 ===== */
function renderSettings(){
  titleEl.textContent='设置';backEl.style.display='none';actionEl.style.display='none';
  var h='<div class="card"><h3>分类管理</h3>';
  if(!DB.categories.length)h+='<div class="muted">还没有分类</div>';
  DB.categories.forEach(function(c){
    var n=DB.works.filter(function(w){return w.category===c.name}).length;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f2f2f5"><div><div style="font-weight:500">'+esc(c.name)+'</div><div class="muted">'+n+' 个作品</div></div><button class="btn sm o" data-delcat="'+c.id+'" style="color:#c33">删除</button></div>';
  });
  h+='</div><button class="btn" id="addCat">＋ 新建分类</button>';
  h+='<div class="card"><h3>今日画画卡片背景</h3><label class="fld">上传背景图（自动以 40% 透明度作为底图）</label><input type="file" id="bgFile" accept="image/*">';
  if(todayBgImg){
    h+='<div style="margin-top:6px;border-radius:10px;overflow:hidden;background:#f0f0f3"><img src="'+todayBgImg+'" style="width:100%;display:block;opacity:.4"></div>'
      +'<button class="btn o" id="bgClear" style="margin-top:10px;color:#c33">移除背景图</button>';
  }
  h+='<div class="muted" style="margin-top:8px">在「统计」页的今日画画卡片上点一下，可全屏显示背景图 5 秒，然后自动恢复。</div></div>';
  h+='<button class="btn o" id="expBtn">一键导出所有数据</button><button class="btn o" id="impBtn">一键导入数据</button>';
  var totalImgs=0;DB.works.forEach(function(w){totalImgs+=workImgCount(w)});
  h+='<div class="card"><h3>存储</h3><div class="muted">作品 '+DB.works.length+' 个 · 图片 '+totalImgs+' 张<br>使用 IndexedDB，容量大，可存原图</div></div>';
  h+='<div class="card"><h3>说明</h3><div class="muted">图片按原图保存。导出文件为 JSON 格式，包含所有分类、作品、图片、打卡、打卡备注、计划、卡片背景。换手机时用「导入数据」恢复即可。</div></div>';
  view.innerHTML=h;
  document.getElementById('addCat').onclick=addCategoryModal;
  document.getElementById('expBtn').onclick=exportAll;
  document.getElementById('impBtn').onclick=importAll;
  var bgFile=document.getElementById('bgFile');
  if(bgFile)bgFile.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    processImage(f).then(function(d){
      todayBgImg=d;
      idbPut('settings',{id:'todayBg',img:d}).then(function(){toast('背景已设置');renderSettings();});
    });
  };
  var bgClear=document.getElementById('bgClear');
  if(bgClear)bgClear.onclick=function(){
    if(!confirm('移除今日画画卡片的背景图？'))return;
    todayBgImg=null;
    idbDel('settings','todayBg').then(function(){toast('已移除');renderSettings();});
  };
  view.querySelectorAll('[data-delcat]').forEach(function(b){b.onclick=function(){
    if(!confirm('删除这个分类？该分类下的作品不会被删除，只影响分类本身。'))return;
    var id=Number(b.dataset.delcat);
    idbDel('categories',id).then(function(){
      DB.categories=DB.categories.filter(function(c){return Number(c.id)!==id});
      toast('已删除');renderSettings();
    });
  }});
}
function exportAll(){
  var pack={version:1,exportedAt:new Date().toISOString(),categories:DB.categories,works:DB.works,checkins:DB.checkins,checkinLogs:DB.checkinLogs,plans:DB.plans,todayBgImg:todayBgImg};
  var blob=new Blob([JSON.stringify(pack)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='draw-backup-'+today()+'.json';a.click();toast('已导出');
}
function importAll(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(!confirm('导入会覆盖当前所有数据，确定继续？'))return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var pack=JSON.parse(rd.result);
        var stores=['categories','works','checkins','checkinLogs','plans','settings'];
        Promise.all(stores.map(function(s){return idbClear(s)})).then(function(){
          DB.categories=pack.categories||[];DB.works=pack.works||[];DB.checkins=pack.checkins||[];DB.checkinLogs=pack.checkinLogs||[];DB.plans=pack.plans||[];
          todayBgImg=pack.todayBgImg||null;
          var ps=[];
          DB.categories.forEach(function(c){ps.push(idbPut('categories',c))});
          DB.works.forEach(function(w){ps.push(idbPut('works',w))});
          DB.checkins.forEach(function(c){ps.push(idbPut('checkins',c))});
          DB.checkinLogs.forEach(function(c){ps.push(idbPut('checkinLogs',c))});
          DB.plans.forEach(function(c){ps.push(idbPut('plans',c))});
          if(todayBgImg)ps.push(idbPut('settings',{id:'todayBg',img:todayBgImg}));
          Promise.all(ps).then(function(){toast('导入完成');go('collections');});
        });
      }catch(err){toast('文件格式错误')}
    };
    rd.readAsText(f);
  };
  inp.click();
}

openIDB().then(function(){
  return Promise.all([idbAll('categories'),idbAll('works'),idbAll('checkins'),idbAll('checkinLogs'),idbAll('plans'),idbAll('settings')]);
}).then(function(r){
  DB.categories=r[0]||[];DB.works=r[1]||[];DB.checkins=r[2]||[];DB.checkinLogs=r[3]||[];DB.plans=r[4]||[];
  var st=(r[5]||[]).filter(function(x){return x.id==='todayBg'})[0];
  todayBgImg=st?st.img:null;
  if(!DB.categories.length){
    var defs=['练习','创作','速写','长期作品'],ps=[];
    defs.forEach(function(n){var c={id:uid(),name:n};DB.categories.push(c);ps.push(idbPut('categories',c));});
    return Promise.all(ps);
  }
}).then(function(){go('collections');}).catch(function(e){
  document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif">数据库初始化失败：'+e.message+'</div>';
});
</script>
